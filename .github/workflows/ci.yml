name: Tests and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend lint and tests
            service: backend-tests
          - name: Frontend lint, tests and build
            service: frontend-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and run checks
        run: docker compose -f compose.test.yaml run --rm --build ${{ matrix.service }}
      - name: Remove test containers
        if: always()
        run: docker compose -f compose.test.yaml down --remove-orphans
